# Builds each stub project in deps/ (build files only, no app code) so Gradle downloads every
# library the apps use, then publishes the Gradle cache and wrapper distributions to the
# `toolchain` branch for offline builds elsewhere.
name: deps
on:
  workflow_dispatch:
  push:
    paths: ['deps/**', '.github/workflows/deps.yml']
permissions:
  contents: write
jobs:
  cache:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.8
          channel: stable
      - name: Kotlin stubs
        run: |
          for d in deps/*-kotlin; do
            echo "::group::$d"
            (cd $d && chmod +x gradlew && ./gradlew --no-daemon -q assembleDebug) || echo "FAILED $d"
            echo "::endgroup::"
          done
      - name: Flutter stubs
        run: |
          for d in deps/*-flutter; do
            echo "::group::$d"
            (cd $d && flutter pub get && flutter build apk --profile --target-platform android-x64) || echo "FAILED $d"
            echo "::endgroup::"
          done
      - name: Publish
        run: |
          cd ~/.gradle
          du -sh caches/modules-2 wrapper/dists || true
          mkdir -p /tmp/out
          tar --zstd -cf /tmp/out/toolchain.tar.zst caches/modules-2 wrapper/dists
          cd /tmp/out && split -b 90m toolchain.tar.zst part. && rm toolchain.tar.zst && ls -la
          git init -q -b toolchain
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add . && git commit -qm "Gradle cache"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" toolchain
