# Publishes the Android SDK pieces needed to build the apps elsewhere (platform 36, build tools, NDK 27)
# to the `sdk` branch, split into parts under GitHub's file size limit.
name: sdk
on:
  workflow_dispatch:
  push:
    paths: ['.github/workflows/sdk.yml']
permissions:
  contents: write
jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - name: Pack
        run: |
          cd "$ANDROID_HOME"
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-37" > /dev/null || true
          ls platforms build-tools ndk 2>/dev/null || true
          BT=$(ls build-tools | sort -V | grep -E '^3[56]' | tail -2 | sed 's#^#build-tools/#' | tr '\n' ' ')
          mkdir -p /tmp/out
          tar --zstd -cf /tmp/out/sdk.tar.zst platforms/android-36* platforms/android-37* $BT licenses
          NDK=$(ls ndk | sort -V | grep -E "^2[78]\." | tail -1); [ -n "$NDK" ] || NDK=$(ls ndk | sort -V | tail -1); echo "NDK $NDK"
          tar --zstd -cf /tmp/out/ndk.tar.zst ndk/$NDK
          cd /tmp/out && split -b 90m sdk.tar.zst sdk.part. && split -b 90m ndk.tar.zst ndk.part. && rm sdk.tar.zst ndk.tar.zst && ls -la
      - name: Publish
        run: |
          cd /tmp/out
          git init -q -b sdk
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add . && git commit -qm "Android SDK parts"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" sdk
