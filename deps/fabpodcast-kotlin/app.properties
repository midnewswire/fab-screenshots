# Build-time settings. Podcast feeds, colors, home rows, player options, ads and links are in
# app/src/main/assets/config.json (or your own online copy, see remoteConfigUrl).
applicationId=com.fabapps.podcast
appName=Fab Podcast
versionCode=1
versionName=1.0.0

# Optional: the address of your own copy of config.json (your website, GitHub raw, Firebase Hosting...).
# When set, the app downloads it on every start, so feeds, ads and links change without an app update.
# Leave empty to use only app/src/main/assets/config.json.
remoteConfigUrl=

# Ad networks built into the app, comma separated. Ship only the networks you use: admob, applovin, meta, unity,
# startio, ironsource, pangle, mintegral, liftoff, inmobi, chartboost, yandex, wortise.
# The order, unit ids and frequency go in config.json under "ads".
adNetworks=admob

# Ad SDK app ids. Unit ids go in config.json. The default is Google's AdMob test id.
admobAppId=ca-app-pub-3940256099942544~3347511713
applovinSdkKey=
