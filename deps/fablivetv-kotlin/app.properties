# Build-time settings. Everything else (colors, layout, player features, ads, links) is set in the admin panel
# under App settings.
applicationId=com.fabapps.livetv
appName=Fab Live TV
versionCode=1
versionName=1.0.0

# Your Fab Live TV admin panel's API. Must end with /api/v1
apiBaseUrl=https://tv.example.com/api/v1

# Ad networks built into the app, comma separated. Ship only the networks you use: admob, applovin, meta, unity,
# startio, ironsource, pangle, mintegral, liftoff, inmobi, chartboost, yandex, wortise.
# The order, unit ids and frequency are set in the admin panel (App settings > Ads).
adNetworks=admob

# Ad SDK app ids. Unit ids are set in the admin panel. The default is Google's AdMob test id.
admobAppId=ca-app-pub-3940256099942544~3347511713
applovinSdkKey=
