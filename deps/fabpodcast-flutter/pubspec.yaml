name: fab_podcast
description: "Fab Podcast: a podcast app for your show or network from RSS feeds, with background audio, downloads and Up Next, no server needed, for Android and iOS."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.13.5

dependencies:
  audio_service: ^0.18.18
  audio_session: ^0.2.4
  cached_network_image: ^4.0.5
  crypto: ^3.0.6
  cryptography: ^2.9.0
  # Ads: one fab_ads_<network> package per network, all at the same ref. See lib/config/ads.dart.
  fab_ads_admob:
    git:
      url: https://github.com/midnewswire/fabads-flutter
      path: packages/fab_ads_admob
      ref: bb3508af4729f98d1bd3d32f026eef3e6bcbc18f
  firebase_core: ^5.0.0
  firebase_messaging: ^17.0.0
  flutter:
    sdk: flutter
  flutter_local_notifications: ^22.3.2
  html: ^0.15.6
  http: ^1.6.0
  in_app_review: ^2.0.12
  just_audio: ^0.10.6
  package_info_plus: ^10.2.2
  path_provider: ^2.1.5
  share_plus: ^13.3.1
  shared_preferences: ^2.5.6
  url_launcher: ^6.3.3
  xml: ^6.6.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/config.json
    - assets/license/
