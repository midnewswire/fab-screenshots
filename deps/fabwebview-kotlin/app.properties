# Build-time settings. Everything else (website, colors, ads, menu) is in app/src/main/assets/config.json.
applicationId=com.fabapps.webview
appName=Fab WebView
versionCode=1
versionName=1.0.0

# Host whose links open this app instead of the browser (no https://).
deepLinkHost=example.com

# Ad networks built into the app, comma separated. Ship only the networks you use: admob, applovin, meta, unity,
# startio, ironsource, pangle, mintegral, liftoff, inmobi, chartboost, yandex, wortise (needs minSdk 24).
# The order, unit ids and frequency go in config.json.
adNetworks=admob

# Ad SDK app ids. Unit ids go in config.json. The default is Google's AdMob test id.
admobAppId=ca-app-pub-3940256099942544~3347511713
applovinSdkKey=
