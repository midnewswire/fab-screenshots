name: fab_wp_news
description: "Fab WP News: a news app for any WordPress site, for Android and iOS."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.13.5

dependencies:
  applovin_max: ^4.6.4
  cached_network_image: ^4.0.5
  cryptography: ^2.9.0
  firebase_core: ^5.0.0
  firebase_messaging: ^17.0.0
  flutter:
    sdk: flutter
  flutter_local_notifications: ^22.3.2
  flutter_widget_from_html: ^0.17.4
  google_mobile_ads: ^9.2.0
  http: ^1.6.0
  in_app_review: ^2.0.12
  package_info_plus: ^10.2.2
  share_plus: ^13.3.1
  shared_preferences: ^2.5.6
  timeago: ^3.7.1
  url_launcher: ^6.3.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/config.json
    - assets/license/
