name: fab_webview
description: "Fab WebView: turn any website into an Android and iOS app."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.13.5

dependencies:
  cryptography: ^2.9.0
  # Ads: one fab_ads_<network> package per network, all at the same ref. See lib/config/ads.dart.
  fab_ads_admob:
    git:
      url: https://github.com/midnewswire/fabads-flutter
      path: packages/fab_ads_admob
      ref: c4f91fb219cf155740053b8b74d928ce08844669
  firebase_core: ^5.0.0
  firebase_messaging: ^17.0.0
  flutter:
    sdk: flutter
  flutter_inappwebview: ^6.1.5
  flutter_local_notifications: ^22.3.2
  http: ^1.6.0
  in_app_review: ^2.0.12
  package_info_plus: ^10.2.2
  permission_handler: ^13.0.2
  share_plus: ^13.3.1
  shared_preferences: ^2.5.6
  url_launcher: ^6.3.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/config.json
    - assets/license/
