# Your app's identity. Change these before publishing, then rebuild.

# Play Store package name (must be unique, e.g. com.yourbrand.wallpapers)
applicationId=com.fabapps.drivewall
# Name under the launcher icon
appName=Drive Wallpapers
# Increase versionCode for every Play Store upload
versionCode=1
versionName=1.0.0

# Optional: link to your own copy of config.json (GitHub raw, your website, Firebase Hosting...).
# When set, the app downloads it on every start, so repositories, ads and links change without an app update.
# Leave empty to use only app/src/main/assets/config.json.
remoteConfigUrl=

# Ad SDK app ids that must be inside the app. Ad unit ids go in config.json.
# The default AdMob id is Google's test id.
admobAppId=ca-app-pub-3940256099942544~3347511713
applovinSdkKey=
